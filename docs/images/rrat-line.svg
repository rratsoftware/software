<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Rata de RratSoft dibujada con una sola línea">
  <!-- =========================================================
       RratSoft — intro: la rata dibujada con una sola línea.
       1) Un punto verde dibuja el trazo (0.3 s a 2.9 s).
       2) Luego un destello neón recorre la línea sin parar;
          la cola se mece, el lomo respira y los bigotes se mueven.
       Animación SMIL: funciona aunque se cargue como <img>.
       ========================================================= -->
  <defs>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- recorrido del lápiz -->
    <path id="rat" d="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164"/>
  </defs>

  <!-- trazo principal (se dibuja y luego respira) -->
  <path d="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164" fill="none" stroke="#e9ece8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.3s" dur="2.6s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.45 0 0.25 1"/>
    <animate attributeName="d" begin="2.9s" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M26 142 C42 170 94 176 128 146 C150 124 160 75 208 69 C236 68 252 75 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 147 236 149 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164"/>
  </path>

  <!-- destello neón que recorre toda la línea -->
  <path d="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164" fill="none" stroke="#9dff3a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="0.07 1" stroke-dashoffset="0.07" filter="url(#neon)" opacity="0">
    <set attributeName="opacity" to="1" begin="2.9s"/>
    <animate attributeName="stroke-dashoffset" values="0.07;-1" begin="2.9s" dur="2.6s" repeatCount="indefinite"
             calcMode="spline" keyTimes="0;1" keySplines="0.5 0 0.5 1"/>
    <animate attributeName="d" begin="2.9s" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M26 142 C42 170 94 176 128 146 C150 124 160 75 208 69 C236 68 252 75 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 147 236 149 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164"/>
  </path>

  <!-- segundo destello, corto y tenue, desfasado -->
  <path d="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164" fill="none" stroke="#d6ffaa" stroke-width="1.8" stroke-linecap="round"
        pathLength="1" stroke-dasharray="0.03 1" stroke-dashoffset="0.03" filter="url(#neon)" opacity="0">
    <set attributeName="opacity" to=".75" begin="3.9s"/>
    <animate attributeName="stroke-dashoffset" values="0.03;-1" begin="3.9s" dur="2.6s" repeatCount="indefinite"
             calcMode="spline" keyTimes="0;1" keySplines="0.5 0 0.5 1"/>
    <animate attributeName="d" begin="2.9s" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" values="M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M26 142 C42 170 94 176 128 146 C150 124 160 75 208 69 C236 68 252 75 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 147 236 149 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164;M18 158 C40 176 92 178 128 146 C150 126 160 78 208 72 C236 70 252 76 262 84 C254 62 266 46 280 50 C296 54 296 74 282 78 C290 76 300 78 310 86 C326 96 344 104 356 112 C360 115 356 120 350 120 C336 122 318 124 302 124 C296 134 294 148 296 160 C300 163 310 163 318 164 C306 166 292 166 286 160 C272 148 236 150 210 156 C200 136 166 128 152 148 C146 158 154 164 172 164 L388 164"/>
  </path>

  <!-- ojo neón con pulso -->
  <circle cx="300" cy="92" r="3.6" fill="#9dff3a" filter="url(#neon)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.4s" fill="freeze"/>
    <animate attributeName="r" values="3.6;4.4;3.6" begin="3.1s" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- bigotes: se dibujan y luego se mueven -->
  <g fill="none" stroke="#e9ece8" stroke-width="1.4" stroke-linecap="round" opacity=".75">
    <animateTransform attributeName="transform" type="rotate" begin="3.4s" dur="1.6s" repeatCount="indefinite"
                      values="0 340 114; -4 340 114; 1 340 114; 0 340 114" keyTimes="0;0.35;0.7;1"/>
    <path d="M338 110 L374 98" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.8s" dur="0.4s" fill="freeze"/>
    </path>
    <path d="M340 114 L378 112" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.9s" dur="0.4s" fill="freeze"/>
    </path>
    <path d="M338 118 L372 126" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" from="1" to="0" begin="3.0s" dur="0.4s" fill="freeze"/>
    </path>
  </g>

  <!-- punto-lápiz que dibuja la línea -->
  <circle r="3.6" fill="#9dff3a" filter="url(#neon)" opacity="0">
    <set attributeName="opacity" to="1" begin="0.3s"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.9s" dur="0.4s" fill="freeze"/>
    <animateMotion begin="0.3s" dur="2.6s" fill="freeze" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines="0.45 0 0.25 1">
      <mpath href="#rat"/>
    </animateMotion>
  </circle>
</svg>
