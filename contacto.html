<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <title>PsicoTrading Elite - Contacto</title>
    
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    gold: {
                        400: '#FACC15',
                        500: '#EAB308',
                        600: '#CA8A04',
                        metallic: '#D4AF37',
                        light: '#F3E5AB'
                    },
                    dark: {
                        900: '#0a0a0a',
                        950: '#050505'
                    }
                }
            }
        }
    }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

</head>
<body class="bg-dark-950 text-gray-100 font-['Inter',sans-serif]">
    
    <header class="fixed top-0 left-0 w-full z-50 bg-dark-950/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-wider text-white">
                <span class="w-8 h-8 rounded bg-gradient-to-br from-gold-metallic to-yellow-600 flex items-center justify-center text-black font-extrabold text-lg shadow-lg shadow-gold-metallic/20">Ψ</span>
                <span>PSICOTRADING</span>
            </a>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
                <a href="index.html" class="hover:text-gold-metallic transition">Inicio</a>
                <a href="nosotros.html" class="hover:text-gold-metallic transition">Nosotros</a>
                <a href="precios.html" class="hover:text-gold-metallic transition">Precios</a>
                <a href="contacto.html" class="hover:text-gold-metallic transition">Contacto</a>
            </nav>
            <div class="flex items-center gap-4">
                <a href="contacto.html" class="hidden sm:inline-block text-sm font-medium text-gray-300 hover:text-white transition">Entrar</a>
                <a href="precios.html" class="bg-gold-metallic hover:bg-yellow-500 text-black font-semibold text-sm px-5 py-2.5 rounded-lg shadow-lg shadow-gold-metallic/20 transition transform hover:-translate-y-0.5">
                    Comenzar
                </a>
            </div>
        </div>
    </header>
    
    <div class="pt-20">
        
    <section id="contacto" class="py-24 px-6 border-t border-neutral-900">
        <div class="max-w-3xl mx-auto bg-dark-900 p-8 md:p-12 rounded-3xl border border-neutral-800">
            <div class="text-center mb-10">
                <h2 class="text-xs font-mono tracking-widest text-gold-metallic uppercase mb-3">FALE CONOSCO</h2>
                <h3 class="text-2xl md:text-3xl font-bold text-white">Dê o primeiro passo rumo à consistência</h3>
            </div>
            <form id="contactForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Seu Nome</label>
                    <input type="text" required class="w-full bg-dark-950 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-metallic transition" placeholder="Ex. Carlos Silva">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Seu E-mail</label>
                    <input type="email" required class="w-full bg-dark-950 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-metallic transition" placeholder="carlos@trader.com">
                </div>
                <div>
                    <label class="block text-xs font-mono text-gray-400 uppercase mb-2">Mensagem ou Dúvida</label>
                    <textarea rows="4" required class="w-full bg-dark-950 border border-neutral-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-gold-metallic transition" placeholder="Conte-nos sobre seus maiores desafios no trading..."></textarea>
                </div>
                <button type="submit" class="w-full bg-gold-metallic hover:bg-yellow-500 text-black font-bold py-4 rounded-xl transition shadow-lg shadow-gold-metallic/20">
                    Enviar Mensagem
                </button>
            </form>
            <div id="formSuccess" class="hidden mt-6 text-center text-gold-metallic font-medium text-sm">
                ¡Mensagem enviada com sucesso! Entraremos em contato em breve.
            </div>
        </div>
    </section>

    </div>
    
<footer class="py-8 px-6 bg-dark-950 border-t border-neutral-900 text-center text-gray-500 text-sm">
    <p>&copy; 2026 PsicoTrading Elite. Todos os direitos reservados.</p>
</footer>
<script src="js/main.js"></script>

</body>
</html>
